<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>כניסת מנהל | לומדים לפסיכומטרי</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  
  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/pages/login-page.js"></script>
</head>
<body>
  <div class="page-container" style="max-width: 500px; display: flex; flex-direction: column; justify-content: center; min-height: 100vh;">
    
    <header class="page-header" style="margin-bottom: 2rem;">
      <h1 class="page-title" style="font-size: 2.5rem;">כניסת מנהל</h1>
    </header>

    <main id="main-content">
      <section class="card card-glass">
        <form id="login-form">
          <div id="login-error" class="text-danger hidden" role="alert" style="margin-bottom: 1.5rem; text-align: center;"></div>
          
          <div class="form-group">
            <label for="email" class="form-label">דוא"ל</label>
            <input type="email" id="email" class="form-input" required autocomplete="email" dir="ltr">
          </div>
          
          <div class="form-group">
            <label for="password" class="form-label">סיסמה</label>
            <input type="password" id="password" class="form-input" required autocomplete="current-password" dir="ltr">
          </div>
          
          <div style="margin-top: 2rem;">
            <button type="submit" class="btn btn-primary" id="btn-login" style="width: 100%;">
              התחברות
            </button>
          </div>
        </form>

        <div class="text-center" style="margin-top: 1.5rem;">
          <a href="./index.html" class="text-muted" style="text-decoration: underline;">חזרה לאתר</a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
